[package]
name = "chess_client_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "chess_client_ui"
path = "src/main.rs"

[dependencies]
chess_logic = { path = "../chess_logic" }
chess_protocol = { path = "../chess_protocol" }
chess_client_net = { path = "../chess_client_net" }

tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"

# GUI
winit = { workspace = true }
softbuffer = { workspace = true }
tiny-skia = { workspace = true }
fontdue = { workspace = true }
image = { workspace = true }

# Только для debug-ботов (используется под #[cfg(debug_assertions)]).
# В release не компилируется, но зависимость остаётся (транзитивно уже есть в chess_logic).
rand = "0.8"
